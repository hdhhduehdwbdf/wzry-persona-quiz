<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择英雄范围 · 王者荣耀人物测试</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../css/app.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<meta name="description" content="男性英雄优先 / 女性英雄优先 / 不限，24 位英雄任你匹配。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="王者荣耀人物测试">
<meta property="og:title" content="选择英雄范围 · 王者荣耀人物测试">
<meta property="og:description" content="男性英雄优先 / 女性英雄优先 / 不限，24 位英雄任你匹配。">
<meta property="og:image" content="https://hdhhduehdwbdf.github.io/wzry-persona-quiz/assets/og-cover.png">
<meta property="og:url" content="https://hdhhduehdwbdf.github.io/wzry-persona-quiz/pages/gender.html">
<link rel="canonical" href="https://hdhhduehdwbdf.github.io/wzry-persona-quiz/pages/gender.html">
<script src="../assets/pwa.js" defer></script>
</head>
<body class="arena-bg min-h-screen">
<div class="relative mx-auto w-full max-w-[460px] min-h-screen overflow-hidden starfield px-5 pb-16">

  <div class="pt-14 text-center rise-in">
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center sigil">
      <span class="text-xl font-bold text-gold-300">择</span>
    </div>
    <h1 class="text-[24px] font-extrabold gold-text">你想和谁并肩？</h1>
    <p class="mt-3 text-[12.5px] text-slate-400">选择候选英雄范围，题目与计分方式完全一致</p>
  </div>

  <div class="mt-9 space-y-3" id="chooser"></div>

  <p class="mt-6 text-center text-[11px] leading-relaxed text-slate-500">
    三种模式题目与计分完全相同，仅候选范围不同；切换将重置作答。
  </p>
</div>

<script src="../js/core.js"></script>
<script>
Store.load();
var OPTIONS = [
  { key: '女', title: '女性英雄优先', note: '花木兰 · 貂蝉 · 王昭君 · 蔡文姬 等', icon: '♀' },
  { key: '男', title: '男性英雄优先', note: '李白 · 韩信 · 诸葛亮 · 赵云 等', icon: '♂' },
  { key: null, title: '不限性别', note: '全部 24 位英雄，一起参与匹配', icon: '✦' }
];
document.getElementById('chooser').innerHTML = OPTIONS.map(function (o, i) {
  var count = o.key ? FIGURES.filter(function (f) { return f.gender === o.key; }).length : FIGURES.length;
  return '<button onclick="choose(' + (o.key ? "'" + o.key + "'" : 'null') + ')" ' +
    'class="glass group flex w-full items-center gap-4 rounded-2xl px-4 py-5 text-left transition-all duration-200 hover:-translate-y-0.5 hover:border-gold-500/50 active:scale-[0.985] rise-in" ' +
    'style="animation-delay:' + (i * 60) + 'ms">' +
    '<span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-gold-500/35 bg-gold-500/10 text-[20px] text-gold-300 transition-transform duration-200 group-hover:scale-110">' + o.icon + '</span>' +
    '<span class="min-w-0 flex-1">' +
      '<span class="block text-[16px] font-semibold text-slate-50">' + o.title + '</span>' +
      '<span class="mt-1 block truncate text-[11.5px] text-slate-400">' + o.note + '</span>' +
    '</span>' +
    '<span class="shrink-0 text-right">' +
      '<span class="block text-[15px] font-bold text-gold-400">' + count + '</span>' +
      '<span class="block text-[10px] text-slate-500">位英雄</span>' +
    '</span></button>';
}).join('');

function choose(g) {
  Store.setGender(g);
  go('quiz.html');
}
</script>
</body>
</html>
