<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>分享卡片 · 王者荣耀人物测试</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../css/app.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<meta name="description" content="多种比例的专属分享卡片，长按即可保存并分享给朋友。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="王者荣耀人物测试">
<meta property="og:title" content="分享卡片 · 王者荣耀人物测试">
<meta property="og:description" content="多种比例的专属分享卡片，长按即可保存并分享给朋友。">
<meta property="og:image" content="https://hdhhduehdwbdf.github.io/wzry-persona-quiz/assets/og-cover.png">
<meta property="og:url" content="https://hdhhduehdwbdf.github.io/wzry-persona-quiz/pages/share.html">
<link rel="canonical" href="https://hdhhduehdwbdf.github.io/wzry-persona-quiz/pages/share.html">
<script src="../assets/pwa.js" defer></script>
<style>
  .seg { display:flex; gap:4px; border-radius:9999px; padding:4px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); }
  .seg button { flex:1; border:0; background:transparent; padding:9px 0; border-radius:9999px; font-size:12.5px; font-family:inherit; color:#a9b4cc; cursor:pointer; transition:all .2s; }
  .seg button.on { background:linear-gradient(160deg,#f7e3ae,#e2b45c 55%,#c9963f); color:#1a1206; font-weight:700; box-shadow:0 6px 18px -8px rgba(226,180,92,.9); }
  .hook span { flex:0 0 auto; font-size:11.5px; color:#a9b4cc; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:9999px; padding:6px 12px; }
</style>
</head>
<body class="arena-bg min-h-screen">
<div class="relative mx-auto w-full max-w-[460px] min-h-screen overflow-hidden starfield px-5 pb-44">

  <div class="flex items-center gap-3 border-b border-white/8 pt-6 pb-4">
    <button class="btn-ghost-gold h-9 w-9 shrink-0 rounded-full text-[14px]" onclick="go('report.html')">←</button>
    <h3 class="text-[16px] font-semibold text-slate-100">分享卡片</h3>
    <span class="ml-auto rounded-full border border-jade-500/35 bg-jade-500/10 px-2.5 py-0.5 text-[11px] text-jade-300">已生成</span>
  </div>

  <div class="seg mt-5">
    <button id="tab-34" class="on" onclick="setRatio('3:4')">小红书 3:4</button>
    <button id="tab-11" onclick="setRatio('1:1')">朋友圈 1:1</button>
    <button id="tab-916" onclick="setRatio('9:16')">封面 9:16</button>
  </div>

  <div class="glass mt-4 rounded-2xl p-3.5">
    <div class="mb-2 flex justify-between text-[10.5px] text-slate-500"><span id="meta-size">750 × 1000</span><span>PNG · 含二维码 · 可直接保存</span></div>
    <canvas id="share-card" class="w-full rounded-xl"></canvas>
  </div>

  <div class="mt-4 flex gap-2.5">
    <button class="btn-gold flex-[1.4] py-3.5 text-[15px]" onclick="saveCard()">保存图片</button>
    <button class="btn-ghost-gold flex-1 py-3.5 text-[14px]" onclick="copyText()">复制文案</button>
  </div>

  <div class="hook mt-4 flex gap-2 overflow-x-auto pb-1" id="hook-row"></div>

  <div class="glass mt-3 rounded-2xl p-4">
    <div class="flex items-center justify-between">
      <p class="flex items-center gap-2 text-[14px] font-semibold text-gold-200"><span class="inline-block h-3.5 w-1 rounded bg-gold-500"></span>分享文案</p>
      <button class="btn-ghost-gold px-3 py-1 text-[11.5px]" onclick="nextCopy()">换一换</button>
    </div>
    <p class="mt-3 text-[12.5px] leading-relaxed text-slate-300" id="share-copy"></p>
    <div class="my-3 gold-rule"></div>
    <p class="text-[11px] leading-relaxed text-slate-500">卡片右下角二维码指向本站，别人扫码就能直接测；配一句「猜猜我像谁」发出去，互动会更好。</p>
  </div>
</div>

<div class="fixed bottom-0 left-1/2 z-50 w-full max-w-[460px] -translate-x-1/2 border-t border-white/10 bg-abyss-950/85 px-5 pb-[calc(14px+env(safe-area-inset-bottom))] pt-4 backdrop-blur-xl">
  <div class="flex flex-wrap gap-2.5">
    <button class="btn-ghost-gold flex-1 py-3.5 text-[15px]" onclick="go('gender.html')">重新测试</button>
    <button class="btn-gold flex-1 py-3.5 text-[15px]" onclick="go('report.html')">返回报告</button>
  </div>
  <p class="mt-2 text-center text-[10.5px] text-slate-500">图片在本地生成，不上传任何服务器</p>
</div>

<script src="../js/core.js"></script>
<script>
ensureAnswers();
var fig = Store.getFigure(Store.data.matchId) || Store.pool()[0];
var pct = Store.data.matchPct || 88;
var scores = Store.data.scores || Store.calcScores();
var sorted = Store.topDims();
var strong = sorted[0], weak = sorted[7];
var ratio = '3:4', copyIdx = 0;

var COPIES = [
  '我测出来是' + fig.name + '，匹配度 ' + pct + '%。' + strong + '最满、' + weak + '垫底，这俩我自己也认。',
  '本来当个乐子，结果说我最像' + fig.name + '。那句「' + fig.quote + '」，我收下了。',
  '我的结果：' + fig.name + ' · ' + fig.tags.join('、') + '。盲点那条写的是「' + fig.blind_spot.slice(0, 22) + '」，想了想，确实是。',
  '几道题测下来，最像' + fig.name + '。拿给队友看，他说「这确实是你」，那就算它准了。',
  '匹配度 ' + pct + '%，最像' + fig.name + '。' + weak + '这项我不服，但建议这条我确实该听。',
  '报告里有一句写我：「' + fig.summary3[1] + '」被一句话说中的感觉，挺奇妙。',
  '我的峡谷人格是' + fig.name + '。开场白那句「' + fig.opener + '」，看笑了。',
  '测了个王者荣耀人格，我是' + fig.name + '型。顺手把队友猜了一圈，猜对好几个。',
  '结果：' + fig.name + '，匹配度 ' + pct + '%。卡片右下角有二维码，想知道自己像谁就扫一下。'
];

function render() {
  drawShareCard(document.getElementById('share-card'), fig, pct, scores, ratio);
  document.getElementById('meta-size').textContent =
    ratio === '3:4' ? '750 × 1000' : (ratio === '1:1' ? '750 × 750' : '750 × 1334');
  document.getElementById('tab-34').className = ratio === '3:4' ? 'on' : '';
  document.getElementById('tab-11').className = ratio === '1:1' ? 'on' : '';
  document.getElementById('tab-916').className = ratio === '9:16' ? 'on' : '';
  document.getElementById('share-copy').textContent = COPIES[copyIdx % COPIES.length];
}
function setRatio(r) {
  ratio = r; render();
  Toast.show('已切换：' + (r === '3:4' ? '小红书 3:4 竖图' : r === '1:1' ? '朋友圈 1:1 方图' : '视频 / 状态 9:16 长图'));
}
function nextCopy() {
  copyIdx++;
  document.getElementById('share-copy').textContent = COPIES[copyIdx % COPIES.length];
  Toast.show('已换文案（第 ' + ((copyIdx % COPIES.length) + 1) + ' / ' + COPIES.length + ' 版）');
}
function saveCard() {
  Store.data.stats.shared = (Store.data.stats.shared || 0) + 1;
  Store.save();
  try {
    var a = document.createElement('a');
    a.href = document.getElementById('share-card').toDataURL('image/png');
    a.download = '我最像' + fig.name + '_' + ratio.replace(':', '-') + '.png';
    a.click();
    Toast.show('已保存：我最像' + fig.name + '（' + ratio + '）.png');
  } catch (e) { Toast.show('当前浏览器不支持直接下载，可长按图片保存'); }
}
function copyText() {
  var txt = document.getElementById('share-copy').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function () { Toast.show('文案已复制'); })
      .catch(function () { Toast.show('复制失败，请手动长按选择'); });
  } else { Toast.show('复制失败，请手动长按选择文案'); }
}
document.getElementById('hook-row').innerHTML =
  [fig.role + ' · ' + fig.tags[0], '最强维：' + strong, '最弱维：' + weak, '专属主色卡片', '含二维码回流']
    .map(function (h) { return '<span>' + h + '</span>'; }).join('');
render();
whenQrReady(render);
</script>
</body>
</html>
