    <button class="btn-gold w-full py-4 text-[16px] animate-glow" onclick="start()">开始测试</button>

<script src="../js/core.js"></script>
<script>
Store.load();
if (Object.keys(Store.data.answers).length >= QUESTIONS.length && Store.data.completed) {
  document.getElementById('resume-hint').textContent = '检测到上次作答记录，重新开始将覆盖原有结果';
}
function start() { go('gender.html'); }

(function renderGrid() {
  var grid = document.getElementById('hero-grid');
  grid.innerHTML = FIGURES.map(function (f) {
    var st = FIG_STYLE[f.id] || { em: f.name[0], a: '#E2B45C', s: 'rgba(226,180,92,0.14)' };
    return '<button class="group flex flex-col items-center gap-1.5 rounded-xl border border-white/8 bg-white/[0.04] py-2.5 transition-all duration-200 hover:-translate-y-0.5 hover:border-gold-500/50 hover:bg-white/[0.08] active:scale-95" ' +
      'data-id="' + f.id + '" onclick="showHero(\'' + f.id + '\')">' +
      '<span class="flex h-8 w-8 items-center justify-center rounded-lg text-[13px] font-bold transition-transform duration-200 group-hover:scale-110" ' +
      'style="color:' + st.a + ';background:' + st.s + ';border:1px solid ' + st.a + '55">' + st.em + '</span>' +
      '<span class="text-[10.5px] text-slate-300">' + f.name + '</span></button>';
  }).join('');
})();

function showHero(id) {
  var f = Store.getFigure(id);
  if (!f) return;
  var st = FIG_STYLE[f.id] || { a: '#E2B45C' };
  var box = document.getElementById('hero-quote');
  box.innerHTML = '<span class="font-semibold" style="color:' + st.a + '">' + f.name + '</span>' +
    '<span class="ml-1.5 text-[11px] text-slate-500">' + f.role + ' · ' + f.tags.join(' / ') + '</span>' +
    '<br><span class="text-gold-200">「' + f.quote + '」</span>';
  box.classList.add('rise-in');
  setTimeout(function () { box.classList.remove('rise-in'); }, 600);
}
</script>
